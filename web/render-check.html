<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f0c2b6" />
    <title>agentnauts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='46' r='34' fill='%23fbf3ea'/><ellipse cx='54' cy='46' rx='22' ry='16' fill='%233a3566'/><ellipse cx='46' cy='40' rx='6' ry='4' fill='white' opacity='.8'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dev only (vite serves it; the build leaves it out): the app as in index.html, for
      // screenshots from a browser tab that is hidden. Hidden tabs get no animation frames
      // or resize notifications, so the 3D view never starts; this fakes both.
      window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
      window.cancelAnimationFrame = (id) => clearTimeout(id);
      window.ResizeObserver = class {
        constructor(cb) { this.cb = cb; this.els = new Set(); }
        observe(el) {
          this.els.add(el);
          setTimeout(() => this.cb([...this.els].map((target) => ({ target, contentRect: target.getBoundingClientRect() })), this), 0);
        }
        unobserve(el) { this.els.delete(el); }
        disconnect() { this.els.clear(); }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
